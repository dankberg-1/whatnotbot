name: Build APK

on:
  push:
    branches:
      - claude/whatnot-web-bot-kxVU4
    paths:
      - 'whatnot-android/**'
  pull_request:
    branches:
      - claude/whatnot-web-bot-kxVU4
    paths:
      - 'whatnot-android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./whatnot-android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install Gradle
        working-directory: .
        run: |
          set -e

          GRADLE_VERSION=8.0
          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate missing Gradle wrapper
        run: |
          set -e
          gradle wrapper --gradle-version 8.0
          chmod +x ./gradlew

      - name: Validate Gradle wrapper
        run: |
          test -s ./gradle/wrapper/gradle-wrapper.jar
          test -s ./gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build Release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: whatnot-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: whatnot-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
